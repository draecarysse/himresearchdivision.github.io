<div class="system-status-grid">
  <div class="status-item">
    <span class="status-label">ARCHIVE</span>
    <span class="status-value">
      <span class="status-dot status-dot--ok"></span> ONLINE
    </span>
  </div>
  <div class="status-item">
    <span class="status-label">SUBJECT</span>
    <span class="status-value">1510</span>
  </div>
  <div class="status-item">
    <span class="status-label">STATUS</span>
    <span class="status-value classified">CLASSIFIED</span>
  </div>
  <div class="status-item">
    <span class="status-label">SESSION</span>
    <span class="status-value" id="session-time">00:00:00</span>
  </div>
</div>

<script>
  (function () {
    var el = document.getElementById("session-time");
    if (!el) return;
    var start = Date.now();
    function tick() {
      var d = new Date(Date.now() - start);
      var h = String(d.getUTCHours()).padStart(2, "0");
      var m = String(d.getUTCMinutes()).padStart(2, "0");
      var s = String(d.getUTCSeconds()).padStart(2, "0");
      el.textContent = h + ":" + m + ":" + s;
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
